<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>顾明泱作品集设计系统</title>
  <link rel="icon" href="data:," />
  <style>
    :root{--paper:#f3f3f3;--ink:#1a1a1a;--stage:#dedede;--line:#8a8a8a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:12px/1 Arial,sans-serif}header{height:41px;padding:0 23px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{margin:0;padding:12px 18px;font-size:18vw;line-height:.82;letter-spacing:-.075em;font-weight:500}.meta{display:grid;grid-template-columns:17% 1fr auto;padding:12px 23px;border-top:1px solid var(--line)}.meta b{font-size:4vw;font-weight:400;letter-spacing:-.05em}.meta i{padding:2px 4px;background:var(--ink);color:var(--paper);font-style:normal}.stage{height:45vh;margin:0 23px 70px;background:var(--stage);display:grid;place-items:center}.stage span{font-size:8vw}.tokens{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.token{height:170px;padding:12px;border-right:1px solid var(--line)}button{border:1px solid;padding:8px;background:none;font:inherit;cursor:pointer}@media(max-width:700px){h1{font-size:34vw}.meta{grid-template-columns:1fr auto}.meta b{grid-column:1/-1;font-size:8vw}.tokens{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header><span>菜单 MENU　｜　/05　档案 ARCHIVE</span><button onclick="document.body.classList.toggle('grid')">网格 GRID ●</button></header>
  <h1>ARCHIVE</h1>
  <div class="meta"><span>2026</span><b>自然色差</b><i>数据可视化 / DATA</i></div>
  <div class="stage"><span>GU/MY</span></div>
  <div class="tokens"><div class="token">纸张 PAPER<br>#F3F3F3</div><div class="token" style="background:#1a1a1a;color:#f3f3f3">文字 INK<br>#1A1A1A</div><div class="token" style="background:#dedede">展台 STAGE<br>#DEDEDE</div><div class="token">分隔线 LINE<br>#8A8A8A</div></div>
</body>
</html>
